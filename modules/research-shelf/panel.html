<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research shelf</title><style>:root{--bg:#100f14;--fg:#e9e6ef;--panel:#19171e;--border:#37323e;--red:#a88bd6;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--bg);color:var(--fg);font:14px system-ui}header,.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:22px;margin:0}button,input{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:9px 12px}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:3px}#summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:24px 0}.stat,article{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:16px}.stat strong{display:block;margin-top:8px;font-size:22px;overflow-wrap:anywhere}#items{display:grid;gap:10px;margin-top:16px}h2{font-size:15px;margin:0 0 6px;overflow-wrap:anywhere}p{line-height:1.5;overflow-wrap:anywhere}.detail,#notice{opacity:.75}.badge{font-size:12px;color:var(--red)}#filter{width:100%}#status{min-height:21px}.actions{margin:14px 0}#workspace{flex:1;min-width:150px}</style><main><header><h1>Research shelf</h1><button id="refresh">Refresh</button></header><p>Saved research reports and their source counts.</p><div class="actions"><button data-open="research">Open Research</button></div><p id="status" role="status" aria-live="polite">Ready.</p><div id="summary"></div><label for="filter">Filter entries</label><input id="filter" type="search" placeholder="Find an entry…"><div id="items"></div><p id="notice"></p></main><script>
const capability="research";
let sequence=0,waiting=null,rows=[];
const $=id=>document.getElementById(id);
function node(tag,text,cls){const n=document.createElement(tag);n.textContent=String(text??'');if(cls)n.className=cls;return n}
function render(){const text=$('filter').value.toLowerCase();$('items').replaceChildren();const visible=rows.filter(r=>[r.title,r.detail,r.status].join(' ').toLowerCase().includes(text));for(const row of visible){const card=node('article','');card.append(node('h2',row.title),node('span',row.status,'badge'),node('p',row.detail,'detail'));$('items').append(card)}if(!visible.length)$('items').append(node('p',text?'No matching entries.':'Nothing here yet.'))}
function refresh(){if(waiting)return;const id='request-'+(++sequence);$('refresh').disabled=true;$('status').textContent='Loading…';const timeout=setTimeout(()=>{if(waiting?.id!==id)return;waiting=null;$('refresh').disabled=false;$('status').textContent='Request timed out. Try Refresh.'},30000);waiting={id,timeout};const message={type:'novum:request',id,capability};if(capability==='git')message.workspace=$('workspace').value.trim();parent.postMessage(message,'*')}
window.addEventListener('message',event=>{if(event.source!==parent)return;const message=event.data;if(message?.type==='novum:theme'){for(const key of ['bg','fg','panel','border','red'])if(typeof message.tokens?.[key]==='string')document.documentElement.style.setProperty('--'+key,message.tokens[key]);if(!sequence)refresh();return}if(message?.type!=='novum:response'||message.id!==waiting?.id)return;clearTimeout(waiting.timeout);waiting=null;$('refresh').disabled=false;if(message.error){$('status').textContent=message.error;return}const data=message.data||{};rows=Array.isArray(data.items)?data.items:[];$('summary').replaceChildren();for(const [key,value]of Object.entries(data.summary||{})){const stat=node('div',key,'stat');stat.append(node('strong',value));$('summary').append(stat)}$('notice').textContent=data.notice||'';$('status').textContent='Updated '+new Date().toLocaleTimeString();render()});
$('refresh').addEventListener('click',refresh);$('filter').addEventListener('input',render);document.querySelector('[data-open]')?.addEventListener('click',event=>parent.postMessage({type:'novum:open',action:event.currentTarget.dataset.open},'*'));
setTimeout(()=>{if(!sequence)refresh()},500);
setInterval(()=>{if(!document.hidden)refresh()},15000);
</script></html>
