<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent tasks</title>
<style>
:root{color-scheme:dark;--bg:#101014;--fg:#eee;--panel:#1a171f;--border:#39333f;--red:#ad8bd4}*{box-sizing:border-box}body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}header,.row-head,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:20px}h2{font-size:14px;margin:0;overflow-wrap:anywhere}p{margin:6px 0 0}small,.muted{font-size:12px;opacity:.72}.toolbar{margin:20px 0 12px}input,select,button{font:inherit;color:var(--fg);background:var(--panel);border:2px solid var(--border);border-radius:8px;padding:8px 12px;min-height:38px}input{flex:1;min-width:140px}button{cursor:pointer}button:hover{border-color:var(--red)}button:disabled{opacity:.6;cursor:wait}:focus-visible{outline:2px solid var(--red);outline-offset:3px}#summary{margin-top:16px;display:flex;gap:18px;flex-wrap:wrap;font-size:12px}#agents{display:grid;gap:10px}.agent{border:2px solid var(--border);border-radius:10px;background:var(--panel);padding:14px}.status{font-size:12px;display:inline-flex;align-items:center;gap:6px}.status:before{content:'●';color:var(--red)}.agent button{margin-top:12px}#status{min-height:20px;font-size:12px;overflow-wrap:anywhere}#empty{padding:24px 0}#empty strong{display:block;margin-bottom:8px}#error{color:var(--red)}[hidden]{display:none!important}::-webkit-scrollbar{width:7px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}html{scrollbar-color:var(--border) transparent;scrollbar-width:thin}@media(max-width:420px){body{padding:12px}input{width:100%}.toolbar select{flex:1}}
</style></head><body>
<header><div><h1>Agent tasks</h1><p class="muted">Delegated tasks and recent agent runs in one place.</p></div><button id="refresh" type="button">Refresh</button></header>
<div id="summary" aria-label="Agent counts"></div>
<div class="toolbar"><input id="search" type="search" aria-label="Find a task" placeholder="Find a task or model…"><select id="filter" aria-label="Task status"><option value="all">All tasks</option><option value="running">Running</option><option value="waiting">Waiting</option><option value="failed">Failed</option><option value="finished">Finished</option></select></div>
<p id="status" role="status"></p><p id="error" role="alert" hidden></p><div id="agents"></div>
<div id="empty" hidden><strong>No agent runs yet.</strong><span class="muted">Delegated tasks and recent agent runs appear here. Open a chat to review a waiting approval or continue interrupted work.</span></div>
<script>
let agents=[],delegated=[],recentRuns=[],sequence=0,pending=new Map(),loadErrors=new Set(),timeout=null;
const $=id=>document.getElementById(id),groups={running:new Set(['running','streaming']),waiting:new Set(['starting','queued','waiting','waiting_approval','waiting_input','awaiting_approval','awaiting_input','pending','paused','interrupted']),failed:new Set(['error','failed']),finished:new Set(['done','success','finished','stopped','cancelled'])};
function node(tag,text,className){const el=document.createElement(tag);el.textContent=text;if(className)el.className=className;return el}
function group(status){for(const [name,values] of Object.entries(groups))if(values.has(String(status||'').toLowerCase()))return name;return 'finished'}
function statusLabel(status){const labels={waiting_approval:'Awaiting approval',awaiting_approval:'Awaiting approval',waiting_input:'Awaiting input',awaiting_input:'Awaiting input',done:'Finished',success:'Finished',error:'Failed'};return labels[status]||String(status||'Unknown').replace(/^./,c=>c.toUpperCase())}
function mergeTasks(){
 const merged=new Map(delegated.filter(item=>item.session_id).map(item=>[item.session_id,{...item}]));
 for(const run of recentRuns){
  if(!run.session_id)continue;
  const updated=Number.isFinite(Number(run.updated))?`Updated ${new Date(Number(run.updated)*1000).toLocaleString()}`:'';
  const existing=merged.get(run.session_id);
  if(!existing){merged.set(run.session_id,{...run,detail:updated});continue}
  existing.can_resume=run.can_resume===true;
  if(run.can_resume===true||['waiting','failed'].includes(group(run.status))||group(existing.status)==='finished')existing.status=run.status;
  if(!existing.title||existing.title==='Agent run')existing.title=run.title;
  if(!existing.model)existing.model=run.model||'';
  existing.detail=[existing.detail,updated].filter(Boolean).join(' · ');
 }
 return [...merged.values()];
}
function render(){
 const query=$('search').value.trim().toLocaleLowerCase(),filter=$('filter').value;
 const counts=Object.fromEntries(Object.keys(groups).map(name=>[name,agents.filter(agent=>group(agent.status)===name).length]));
 $('summary').replaceChildren(node('span',`${agents.length} tasks`),...Object.entries(counts).map(([name,count])=>node('span',`${count} ${name}`)));
 const shown=agents.filter(agent=>(`${agent.title} ${agent.model||''} ${agent.detail||''}`.toLocaleLowerCase().includes(query))&&(filter==='all'||filter===group(agent.status)));
 $('agents').replaceChildren();
 for(const agent of shown){const card=node('article','','agent'),head=node('div','','row-head'),state=group(agent.status);head.append(node('h2',agent.title||'Agent run'),node('span',statusLabel(agent.status),'status'));card.append(head,node('p',agent.model||'','muted'));if(agent.detail)card.append(node('p',agent.detail,'muted'));const open=node('button',agent.can_resume===true?'Resume stream':'Open chat');open.type='button';open.addEventListener('click',()=>parent.postMessage({type:'novum:open',action:'session',session_id:agent.session_id},'*'));card.append(open);$('agents').append(card)}
 $('empty').hidden=agents.length>0||pending.size>0;
 if(agents.length&&!shown.length)$('agents').append(node('p','No matching tasks. Try another name or status.','muted'));
}
function refresh(){
 if(pending.size)return;
 loadErrors.clear();
 for(const capability of ['subagents','runs']){const id=`${capability}-${++sequence}`;pending.set(id,capability);parent.postMessage({type:'novum:request',id,capability},'*')}
 $('refresh').disabled=true;$('status').textContent='Refreshing tasks…';render();
 timeout=setTimeout(()=>{pending.clear();$('refresh').disabled=false;$('status').textContent='Showing the last available results.';$('error').hidden=false;$('error').textContent='Some task data did not respond. Try Refresh.';render()},15000);
}
addEventListener('message',event=>{
 if(event.source!==parent||!event.data)return;
 const message=event.data;
 if(message.type==='novum:theme'){for(const key of ['bg','fg','panel','border','red'])if(typeof message.tokens?.[key]==='string')document.documentElement.style.setProperty(`--${key}`,message.tokens[key]);return}
 if(message.type!=='novum:response'||!pending.has(message.id))return;
 const capability=pending.get(message.id);pending.delete(message.id);
 if(message.error)loadErrors.add(capability);
 else{loadErrors.delete(capability);const items=Array.isArray(message.data?.items)?message.data.items:[];if(capability==='subagents')delegated=items;else recentRuns=items}
 agents=mergeTasks();clearTimeout(timeout);$('refresh').disabled=pending.size>0;
 if(!pending.size){$('status').textContent='Updated';$('error').hidden=loadErrors.size===0;if(loadErrors.size)$('error').textContent=`Could not refresh ${[...loadErrors].join(' and ')}. Showing the last available results.`}
 else timeout=setTimeout(()=>{pending.clear();$('refresh').disabled=false;$('status').textContent='Showing the last available results.';$('error').hidden=false;$('error').textContent='Some task data did not respond. Try Refresh.'},15000);
 render();
});
$('refresh').addEventListener('click',refresh);$('search').addEventListener('input',render);$('filter').addEventListener('change',render);setInterval(()=>{if(!document.hidden)refresh()},5000);refresh();
</script></body></html>
