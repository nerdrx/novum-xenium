[package]
name = "novum-xenium-desktop"
version = "0.1.0"
description = "Novum Xenium desktop backend"
authors = ["Novum Xenium"]
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "novum_xenium_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
